# nginx: serve usage.json only to requests with the right X-Key header.
# Put this inside your HTTPS `server { … }` block and replace CHANGE_ME with your secret
# (the value of the Keychain item ai-sphere-watch-key). Upload the file over SFTP, FTPS or WebDAV
# into the folder that `root` points to.

location = /usage.json {
    if ($http_x_key != "CHANGE_ME") {
        return 403;
    }
    default_type application/json;
    types { }                                   # force application/json whatever the extension map says
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Keep the temporary upload names private.
location ~ /usage\.json\.tmp$ { return 404; }
