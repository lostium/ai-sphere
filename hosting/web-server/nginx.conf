# nginx: serve usage.json only to requests with the right X-Key header.
# Put this inside your HTTPS `server { … }` block and replace CHANGE_ME with your secret
# (the value of the Keychain item ai-sphere-watch-key). Upload the file over SFTP, FTPS or WebDAV
# into the folder that `root` points to. If you use a sub-folder, add it to both patterns.
# After installing, run hosting/check.sh: it must report 403 without the key.

# Keep the temporary upload names private (checked first).
location ~* /usage\.json\.tmp$ { return 404; }

# Case-insensitive, so /USAGE.JSON cannot bypass the check on case-insensitive file systems.
location ~* ^/usage\.json$ {
    if ($http_x_key != "CHANGE_ME") {
        return 403;
    }
    default_type application/json;
    types { }                                   # force application/json whatever the extension map says
    # private: the response depends on the X-Key, so shared caches in front must not reuse it.
    add_header Cache-Control "private, max-age=60" always;
    add_header Vary "X-Key" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
